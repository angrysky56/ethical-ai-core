[project]
name = "ethical-ai-core"
version = "0.1.0"
description = "Core Self bootstrapping via Feedback Alignment and Test-Time Training"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "transformers>=4.30.0",
    "peft>=0.5.0",
    "safetensors>=0.3.0",
    "scipy>=1.10.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "gradio>=4.0.0",
]

[project.scripts]
demo = "demo:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = "."
